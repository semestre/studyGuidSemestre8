<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Comparativo BI</title>
  <link rel="stylesheet" href="../../../assets/style.css">
</head>
<body>
  <div class="page">
    <a class="back-link" href="index.html">&larr; Back to Comparativo BI</a>
    <header>
      <h1 id="page-title">Comparativo BI</h1>
    </header>

    <div class="toolbar">
      <input type="search" id="search" placeholder="Buscar...">
      <div class="toolbar-row">
        <p class="result-count" id="result-count"></p>
        <button type="button" class="play-btn" id="play-btn" style="--accent: var(--accent-bi)">&#9654; Jugar</button>
      </div>
    </div>

    <div class="card-grid" id="card-grid"></div>
  </div>

  <script src="../../../../backend/data/bi.js"></script>
  <script src="../../../assets/flashcards.js"></script>
  <script>
    const type = getQueryParam("type") || "perfil";
    const types = {
      perfil: { label: "Perfil de cada herramienta", items: BI_COMPARATIVO_PERFIL },
      detalle: { label: "Comparación detallada — 13 características", items: BI_COMPARATIVO_DETALLE },
      puntuacion: { label: "Puntuación y recomendación", items: BI_COMPARATIVO_PUNTUACION },
    };

    const current = types[type] || types.perfil;
    document.getElementById("page-title").textContent = current.label;
    const baseItems = current.items;

    const grid = document.getElementById("card-grid");
    const searchInput = document.getElementById("search");
    const resultCount = document.getElementById("result-count");

    function update() {
      const items = filterFlashcards(baseItems, searchInput.value);
      renderFlashcards(grid, items);
      resultCount.textContent = `${items.length} resultado${items.length === 1 ? "" : "s"}`;
    }

    searchInput.addEventListener("input", update);
    update();

    document.getElementById("play-btn").addEventListener("click", () => {
      startFlashcardGame(filterFlashcards(baseItems, searchInput.value));
    });
  </script>
</body>
</html>
