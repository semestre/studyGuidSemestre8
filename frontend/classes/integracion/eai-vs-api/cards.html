<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EAI vs API</title>
  <link rel="stylesheet" href="../../../assets/style.css">
</head>
<body>
  <div class="page">
    <a class="back-link" href="../../../integracion.html">&larr; Back to Integración</a>
    <header>
      <h1>EAI vs API</h1>
    </header>

    <div class="toolbar">
      <input type="search" id="search" placeholder="Buscar...">
      <div class="toolbar-row">
        <p class="result-count" id="result-count"></p>
        <button type="button" class="play-btn" id="play-btn" style="--accent: var(--accent-integracion)">&#9654; Jugar</button>
      </div>
    </div>

    <div class="card-grid" id="card-grid"></div>
  </div>

  <script src="../../../../backend/data/integracion.js"></script>
  <script src="../../../assets/flashcards.js"></script>
  <script>
    const baseItems = INTEGRACION_EAI_VS_API;

    const grid = document.getElementById("card-grid");
    const searchInput = document.getElementById("search");
    const resultCount = document.getElementById("result-count");

    function update() {
      const items = filterFlashcards(baseItems, searchInput.value);
      renderFlashcards(grid, items);
      resultCount.textContent = `${items.length} resultado${items.length === 1 ? "" : "s"}`;
    }

    searchInput.addEventListener("input", update);
    update();

    document.getElementById("play-btn").addEventListener("click", () => {
      startFlashcardGame(filterFlashcards(baseItems, searchInput.value));
    });
  </script>
</body>
</html>
