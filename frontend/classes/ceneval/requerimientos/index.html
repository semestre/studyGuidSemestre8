<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Requerimientos</title>
  <link rel="stylesheet" href="../../../assets/style.css">
</head>
<body class="center-page">
  <header>
    <h1>Requerimientos</h1>
    <p>Choose a topic</p>
  </header>

  <div class="class-grid">
    <a class="class-btn" style="--accent: var(--accent-requerimientos)" href="cards.html?type=definitions">
      Definiciones
      <span class="subtitle">Taxonomía de Requerimientos</span>
    </a>
    <a class="class-btn" style="--accent: var(--accent-requerimientos)" href="cards.html?type=examples">
      Ejemplos
      <span class="subtitle">Requerimientos clasificados 1-50</span>
    </a>
  </div>

  <button type="button" class="play-all-btn" id="play-all-btn" style="--accent: var(--accent-requerimientos)">&#9654; Jugar todo</button>

  <a class="back-link" href="../../../ceneval.html">&larr; Back to CENEVAL</a>

  <script src="../../../../backend/data/requerimientos.js"></script>
  <script src="../../../assets/flashcards.js"></script>
  <script>
    const allRequerimientos = [...REQUERIMIENTOS_DEFINITIONS, ...REQUERIMIENTOS_EXAMPLES];
    const playAllBtn = document.getElementById("play-all-btn");
    playAllBtn.textContent = `▶ Jugar todo (${allRequerimientos.length})`;
    playAllBtn.addEventListener("click", () => {
      startFlashcardGame(allRequerimientos);
    });
  </script>
</body>
</html>
