<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Glosario</title>
  <link rel="stylesheet" href="../../../assets/style.css">
</head>
<body class="center-page">
  <header>
    <h1>Glosario</h1>
    <p>Choose a range of terms</p>
  </header>

  <div class="class-grid">
    <a class="class-btn" style="--accent: var(--accent-glosario)" href="cards.html?range=all">
      Glosario completo
      <span class="subtitle">150 términos</span>
    </a>
    <a class="class-btn" style="--accent: var(--accent-glosario)" href="cards.html?range=1-20">
      1 - 20
      <span class="subtitle">Con descripción ampliada</span>
    </a>
    <a class="class-btn" style="--accent: var(--accent-glosario)" href="cards.html?range=21-40">
      21 - 40
      <span class="subtitle">20 términos</span>
    </a>
  </div>

  <button type="button" class="play-all-btn" id="play-all-btn">&#9654; Jugar todo</button>

  <a class="back-link" href="../../../ceneval.html">&larr; Back to CENEVAL</a>

  <script src="../../../../backend/data/glossary.js"></script>
  <script src="../../../assets/flashcards.js"></script>
  <script>
    const playAllBtn = document.getElementById("play-all-btn");
    playAllBtn.textContent = `▶ Jugar todo (${GLOSSARY.length} términos)`;
    playAllBtn.addEventListener("click", () => {
      startFlashcardGame(GLOSSARY);
    });
  </script>
</body>
</html>
